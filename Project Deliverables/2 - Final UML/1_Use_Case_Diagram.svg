<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1680" viewBox="0 0 1880 1680" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1880" height="1680" fill="#FFFFFF"/><defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2F4F4A" stroke-width="1.3"/></marker><marker id="tri" markerWidth="18" markerHeight="18" refX="15" refY="8" orient="auto"><path d="M0,0 L15,8 L0,16 Z" fill="#FFFFFF" stroke="#2F4F4A" stroke-width="1.3"/></marker></defs><text x="940.0" y="37.4" font-size="21" font-weight="bold" text-anchor="middle" fill="#1F3B36">Use Case Diagram — ISU Infirmary Logbook Management and Health Surveillance System</text><rect x="270" y="185" width="1360" height="1465" fill="none" stroke="#107A6B" stroke-width="2" rx="6"/><text x="950" y="1642.7" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#107A6B">«system» ISU Infirmary Logbook Management and Health Surveillance System</text><path d="M470 236 L470 330 L1330 330 L1330 236 L602.4 236 L594.4 214 L470 214 Z" fill="#FFFFFF" stroke="#9DB4AE" stroke-width="1.4"/><line x1="470" y1="236" x2="602.4" y2="236" stroke="#9DB4AE" stroke-width="1.4"/><text x="479" y="229.4" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1F3B36">Account access</text><ellipse cx="620" cy="280" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="620" y="284.4" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">Sign in</text><ellipse cx="900" cy="280" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="900" y="284.4" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">Sign out</text><ellipse cx="1180" cy="280" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="1180" y="276.9" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">Reset password</text><text x