.5"/><text x="435" y="586.9" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">Manage patient records</text><text x="435" y="601.9" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">(edit, move to trash)</text><ellipse cx="435" cy="670" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="435" y="674.4" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">Search patient history</text><ellipse cx="435" cy="750" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="435" y="746.9" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">Print medical certificate /</text><text x="435" y="761.9" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">parental notification</text><ellipse cx="435" cy="830" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="435" y="834.4" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">View nurse dashboard</text><path d="M300 917 L300 1005 L900 1005 L900 917 L470.4 917 L462.4 895 L300 895 Z" fill="#FFFFFF" stroke="#9DB4AE" stroke-width="1.4"/><line x1="300" y1="917" x2="470.4" y2="917" stroke="#9DB4AE" stroke-width="1.4"/><text x="309" y="910.4" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1F3B36">Health surveillance</text><ellipse cx="435" cy="950" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="435" y="954.4" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">View Outbreak watch</text><ellipse cx="755" cy="950" rx="116.0" ry="27.0" fill="#F3FAF8" stroke="#107A6B" stroke-width="1.5"/><text x="755" y="946.9" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">Check for possible</text><text x="755" y="961.9" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1F3B36">outbreaks</text><path d="M300 1052 L300 1352 L900 13