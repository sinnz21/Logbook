  <script>
/* Preview only: some viewers block real form submission. Send forms through
   React's onSubmit handler directly so Sign in, Send code, etc. still work. */
(function(){
  function send(f){ f.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); }
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button'); if(!b||!b.form) return;
    var t=(b.getAttribute('type')||'submit').toLowerCase(); if(t!=='submit') return;
    e.preventDefault(); if(!b.disabled) send(b.form);
  },true);
  document.addEventListener('keydown',function(e){
    var el=e.target; if(e.key!=='Enter'||!el||el.tagName!=='INPUT'||!el.form) return;
    e.preventDefault(); var s=el.form.querySelector('button[type=submit],button:not([type])'); if(!s||!s.disabled) send(el.form);
  },true);
})();
</script>
